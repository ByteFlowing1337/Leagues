name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src\Leagues.csproj -c Release
      - run: dotnet test tests\Leagues.Tests.csproj -c Debug
  format:
    name: Formatting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format --verify-no-changes